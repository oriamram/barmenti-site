<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="theme-color" content="#17120F" />
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap"
    />
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />
  </head>
  <body class="{{ page.layout_class | default: 'page' }}">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/logo.webp' | relative_url }}" alt="" width="40" height="40" />
        <span>{{ site.title }}</span>
      </a>
    </header>

    <main class="content">{{ content }}</main>

    <footer class="site-footer">
      <nav>
        <a href="{{ '/privacy/' | relative_url }}">מדיניות פרטיות</a>
        <a href="{{ '/terms/' | relative_url }}">תנאי שימוש</a>
        <a href="{{ '/delete-account/' | relative_url }}">מחיקת חשבון</a>
        <a href="mailto:{{ site.contact_email }}">צרו קשר</a>
      </nav>
      <p>© {{ 'now' | date: '%Y' }} ברמנתי</p>
    </footer>
  </body>
</html>
